# Builds Jace Launcher for Windows, macOS and Linux on GitHub's runners.
# Every push / PR uploads the builds as workflow artifacts.
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # PySide6 6.10+ on Windows needs icuuc.dll from Windows 10+, which Wine
        # (Bottles, Lutris, Proton) doesn't have; 6.9 doesn't need it
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow "PySide6>=6.9,<6.10"
      - name: Test folder sync (junctions)
        run: python tests/sync_check.py
      - name: Build .exe
        run: python packaging/build.py
      - name: Test the Windows installer, update and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:JACE_LAUNCHER_HOME = "$env:RUNNER_TEMP\jace-home"
          $setup = (Get-ChildItem dist\*.exe)[0].FullName
          function Run($exe, $argList) {
            $p = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe $argList exited with $($p.ExitCode)" }
          }
          # 1. install from the downloaded .exe
          Run $setup "--install --yes"
          $dir = "$env:LOCALAPPDATA\Programs\Jace Launcher"
          $exe = "$dir\JaceLauncher.exe"
          if (!(Test-Path $exe)) { throw "not installed" }
          if (!(Test-Path "$dir\_internal")) { throw "_internal missing" }
          foreach ($dll in "vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","concrt140.dll") {
            if (!(Test-Path "$dir\_internal\$dll")) { throw "VC++ runtime $dll not bundled" }
          }
          $sm = [Environment]::GetFolderPath("Programs") + "\Jace Launcher.lnk"
          $dt = [Environment]::GetFolderPath("Desktop") + "\Jace Launcher.lnk"
          if (!(Test-Path $sm)) { throw "Start menu shortcut missing" }
          if (!(Test-Path $dt)) { throw "desktop shortcut missing" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\JaceLauncher"
          if (!(Test-Path $key)) { throw "Installed apps entry missing" }
          Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, UninstallString | Format-List
          # 2. the installed copy (fast onedir launcher) really starts
          $env:JACE_SELF_TEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          Run $exe "--self-test"
          Get-Content $env:JACE_SELF_TEST_OUT
          # 3. update step: the new setup .exe installs over the existing copy
          Run $setup "--apply-update `"$dir`" --no-gui --no-relaunch"
          Run $exe "--self-test"
          Get-Content $env:JACE_SELF_TEST_OUT
          # 4. uninstall removes everything
          Run $exe "--uninstall"
          Start-Sleep -Seconds 8
          if (Test-Path $dir) { throw "install folder left behind" }
          if (Test-Path $sm) { throw "Start menu shortcut left behind" }
          if (Test-Path $key) { throw "Installed apps entry left behind" }
          "WINDOWS INSTALLER OK"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe

  wine:
    # Run the Windows .exe under Bottles' "Soda" Wine runner, like Linux users do
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: win
      - name: Get Soda (Bottles' Wine runner)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgnutls30t64 libfreetype6 libfontconfig1
          gh release download soda-11.0-25-experimental -R bottlesdevs/wine -p "*x86_64.tar.xz"
          tar xf soda-*.tar.xz
      - name: Self-test under Wine
        run: |
          export PATH="$PWD/$(ls -d soda-*/ | head -1)bin:$PATH" WINEPREFIX="$RUNNER_TEMP/prefix" WINEDEBUG=err+module
          xvfb-run -a wineboot -i
          QT_QPA_PLATFORM=offscreen JACE_SELF_TEST_OUT='C:\selftest.txt' timeout 600 xvfb-run -a wine win/*.exe --self-test || true
          cat "$WINEPREFIX/drive_c/selftest.txt"
          grep -q "SELF-TEST OK" "$WINEPREFIX/drive_c/selftest.txt"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel     # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # PySide6 6.10+ needs macOS 13; 6.9 keeps macOS 12 Monterey working
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow "PySide6>=6.9,<6.10"
      - name: Test folder sync
        run: python tests/sync_check.py
      - name: Build .app
        run: python packaging/build.py
      - name: Smoke test (start the packaged app headless)
        env:
          QT_QPA_PLATFORM: offscreen
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home
        run: '"build/darwin/dist/Jace Launcher.app/Contents/MacOS/Jace Launcher" --self-test'
      - name: Check it still supports macOS 12 Monterey
        run: |
          MIN=$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "build/darwin/dist/Jace Launcher.app/Contents/Info.plist")
          echo "LSMinimumSystemVersion = $MIN"
          [ "${MIN%%.*}" -le 12 ] || { echo "::error::Build needs macOS $MIN; must run on macOS 12"; exit 1; }
      - name: Test the Mac installer (install from a downloaded .app, then uninstall)
        env:
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home-install
        run: |
          set -x
          DL="$RUNNER_TEMP/Downloads"
          mkdir -p "$DL"
          # unzip like Safari does, and mark it as downloaded from the internet
          ditto -x -k dist/*.app.zip "$DL"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$DL/Jace Launcher.app"
          "$DL/Jace Launcher.app/Contents/MacOS/Jace Launcher" --install --yes
          APP="/Applications/Jace Launcher.app"
          test -d "$APP"
          test -L "$HOME/Desktop/Jace Launcher"
          defaults read com.apple.dock persistent-apps | grep -q "Jace%20Launcher.app"
          if xattr -r "$APP" | grep -q com.apple.quarantine; then echo "::error::app still quarantined"; exit 1; fi
          QT_QPA_PLATFORM=offscreen "$APP/Contents/MacOS/Jace Launcher" --self-test
          "$APP/Contents/MacOS/Jace Launcher" --uninstall
          sleep 5
          test ! -e "$APP"
          test ! -e "$HOME/Desktop/Jace Launcher"
          if defaults read com.apple.dock persistent-apps | grep -q "Jace%20Launcher.app"; then echo "::error::Dock icon left behind"; exit 1; fi
          echo "MAC INSTALLER OK"
      - name: Test a real update (pretend to be 1.0.0, update from the latest release)
        env:
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home-update
          JACE_FAKE_VERSION: "1.0.0"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ditto -x -k dist/*.app.zip /Applications
          APP="/Applications/Jace Launcher.app"
          "$APP/Contents/MacOS/Jace Launcher" --install --yes
          "$APP/Contents/MacOS/Jace Launcher" --update --yes --no-relaunch
          LATEST=$(gh release view -R "${{ github.repository }}" --json tagName --jq .tagName | tr -d v)
          for i in $(seq 1 30); do
            V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist" 2>/dev/null || true)
            [ "$V" = "$LATEST" ] && [ -x "$APP/Contents/MacOS/Jace Launcher" ] && [ ! -e "$APP.new" ] && break; sleep 2
          done
          echo "installed version now: $V (latest release: $LATEST)"
          [ "$V" = "$LATEST" ]
          QT_QPA_PLATFORM=offscreen "$APP/Contents/MacOS/Jace Launcher" --self-test
          echo "MAC UPDATE OK"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.app.zip

  linux:
    # older Ubuntu = older glibc = the AppImage runs on more distros
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0 desktop-file-utils
      - name: Create virtualenv
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Test folder sync
        run: .venv/bin/python tests/sync_check.py
      - name: Build AppImage
        run: ./packaging/build_appimage.sh
      - name: Smoke test (start the packaged app headless)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home
        run: ./dist/JaceLauncher-*-x86_64.AppImage --self-test
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, wine, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  store:
    # Publish the new release to Jace Store as links to the GitHub downloads.
    # Needs the JACE_STORE_TOKEN repository secret; skipped if it isn't set.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    env:
      JACE_STORE_TOKEN: ${{ secrets.JACE_STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish to Jace Store
        run: |
          if [ -z "$JACE_STORE_TOKEN" ]; then
            echo "::warning::JACE_STORE_TOKEN secret not set - skipping Jace Store"
            exit 0
          fi
          python3 packaging/publish_store.py "${{ github.ref_name }}"

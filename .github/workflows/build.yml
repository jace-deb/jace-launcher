# Builds Jace Launcher for Windows, macOS and Linux on GitHub's runners.
# Every push / PR uploads the builds as workflow artifacts.
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: python packaging/build.py
      - name: Smoke test (start the packaged app headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:JACE_LAUNCHER_HOME = "$env:RUNNER_TEMP\jace-home"
          $env:JACE_SELF_TEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "build\win32\dist\JaceLauncher\JaceLauncher.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $env:JACE_SELF_TEST_OUT
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel     # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        # PySide6 6.10+ needs macOS 13; 6.9 keeps macOS 12 Monterey working
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow "PySide6>=6.9,<6.10"
      - name: Build .app
        run: python packaging/build.py
      - name: Smoke test (start the packaged app headless)
        env:
          QT_QPA_PLATFORM: offscreen
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home
        run: '"build/darwin/dist/Jace Launcher.app/Contents/MacOS/Jace Launcher" --self-test'
      - name: Check it still supports macOS 12 Monterey
        run: |
          MIN=$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "build/darwin/dist/Jace Launcher.app/Contents/Info.plist")
          echo "LSMinimumSystemVersion = $MIN"
          [ "${MIN%%.*}" -le 12 ] || { echo "::error::Build needs macOS $MIN; must run on macOS 12"; exit 1; }
      - name: Test the Mac installer (install from a downloaded .app, then uninstall)
        env:
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home-install
        run: |
          set -x
          DL="$RUNNER_TEMP/Downloads"
          mkdir -p "$DL"
          # unzip like Safari does, and mark it as downloaded from the internet
          ditto -x -k dist/*.app.zip "$DL"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$DL/Jace Launcher.app"
          "$DL/Jace Launcher.app/Contents/MacOS/Jace Launcher" --install --yes
          APP="/Applications/Jace Launcher.app"
          test -d "$APP"
          test -L "$HOME/Desktop/Jace Launcher"
          defaults read com.apple.dock persistent-apps | grep -q "Jace%20Launcher.app"
          if xattr -r "$APP" | grep -q com.apple.quarantine; then echo "::error::app still quarantined"; exit 1; fi
          QT_QPA_PLATFORM=offscreen "$APP/Contents/MacOS/Jace Launcher" --self-test
          "$APP/Contents/MacOS/Jace Launcher" --uninstall
          sleep 5
          test ! -e "$APP"
          test ! -e "$HOME/Desktop/Jace Launcher"
          if defaults read com.apple.dock persistent-apps | grep -q "Jace%20Launcher.app"; then echo "::error::Dock icon left behind"; exit 1; fi
          echo "MAC INSTALLER OK"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.app.zip

  linux:
    # older Ubuntu = older glibc = the AppImage runs on more distros
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0 desktop-file-utils
      - name: Create virtualenv
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Build AppImage
        run: ./packaging/build_appimage.sh
      - name: Smoke test (start the packaged app headless)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
          JACE_LAUNCHER_HOME: ${{ runner.temp }}/jace-home
        run: ./dist/JaceLauncher-*-x86_64.AppImage --self-test
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

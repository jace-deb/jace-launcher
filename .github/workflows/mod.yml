# Builds Jace Friends for every Minecraft version and loader, starts the game
# with each build to prove it loads, and on a mod-v* tag publishes the jars to
# Jace Store.
name: Mod

on:
  push:
    branches: [main]
    paths: ["mod/**", ".github/workflows/mod.yml"]
    tags: ["mod-v*"]
  workflow_dispatch:
    inputs:
      nodes:
        description: "Only these targets, comma-separated (e.g. 1.21.1-fabric,1.20.4-neoforge). Empty = all."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.pick.outputs.nodes }}
    steps:
      - id: pick
        env:
          ALL: "1.20.1-fabric,1.20.1-forge,1.20.2-fabric,1.20.4-fabric,1.20.4-neoforge,1.20.6-fabric,1.20.6-neoforge,1.21.1-fabric,1.21.1-neoforge,1.21.3-fabric,1.21.3-neoforge,1.21.4-fabric,1.21.4-neoforge,1.21.5-fabric,1.21.5-neoforge,1.21.8-fabric,1.21.8-neoforge,1.21.10-fabric,1.21.10-neoforge,1.21.11-fabric,1.21.11-neoforge,26.1.2-fabric,26.1.2-neoforge,26.2-fabric,26.2-neoforge,26.3-fabric,26.3-neoforge"
          ONLY: ${{ github.event.inputs.nodes }}
        run: |
          list="${ONLY:-$ALL}"
          echo "nodes=$(echo "$list" | tr -d ' ' | jq -Rc 'split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.targets.outputs.nodes) }}
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Install a virtual screen and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils mesa-vulkan-drivers
      - name: Build
        run: ./gradlew ":${{ matrix.node }}:build" --no-daemon
      - name: Start Minecraft with the mod
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
        run: ci/smoke.sh "${{ matrix.node }}"
      - name: Upload game logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.node }}
          path: |
            mod/smoke-*.log
            mod/run/logs/
            mod/run/crash-reports/
            mod/versions/${{ matrix.node }}/run/logs/
            mod/versions/${{ matrix.node }}/run/crash-reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.node }}
          path: mod/versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/mod-v')
    needs: build
    runs-on: ubuntu-latest
    env:
      JACE_STORE_TOKEN: ${{ secrets.JACE_STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: jars
          merge-multiple: true
      - name: Publish to Jace Store
        run: |
          if [ -z "$JACE_STORE_TOKEN" ]; then echo "::warning::JACE_STORE_TOKEN not set"; exit 0; fi
          python3 packaging/publish_mod.py jars
